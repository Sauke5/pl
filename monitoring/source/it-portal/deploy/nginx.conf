worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;
events { worker_connections 1024; }
http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    # Query strings may contain OIDC codes; do not log requests or Referer.
    log_format safe '$remote_addr $request_method $uri $status $body_bytes_sent';
    access_log /dev/stdout safe;
    client_body_temp_path /tmp/client_temp;
    proxy_temp_path /tmp/proxy_temp;
    fastcgi_temp_path /tmp/fastcgi_temp;
    uwsgi_temp_path /tmp/uwsgi_temp;
    scgi_temp_path /tmp/scgi_temp;
    sendfile on;
    server_tokens off;
    # Optional per-installation edge trust; empty in standalone/demo images.
    include /etc/nginx/portal-realip/*.conf;
    resolver 127.0.0.11 valid=5s ipv6=off;
    server {
        listen 8080;
        root /usr/share/nginx/html;
        index index.html;
        set $portal_api_upstream api:8080;
        client_max_body_size 5m;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy same-origin always;
        add_header X-Frame-Options DENY always;
        location = /api/v1/stream {
            proxy_pass http://$portal_api_upstream;
            proxy_http_version 1.1;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header Connection '';
            proxy_buffering off;
            proxy_cache off;
            proxy_read_timeout 1h;
            add_header X-Accel-Buffering no;
        }
        location ~ ^/(api/|auth/|health/) {
            proxy_pass http://$portal_api_upstream;
            proxy_http_version 1.1;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header Connection '';
            proxy_connect_timeout 5s;
            proxy_read_timeout 60s;
        }
        location ~ ^/(admin/|websites/|directory(?:/|$)) {
            proxy_pass http://$portal_api_upstream;
            proxy_http_version 1.1;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header Connection '';
            proxy_read_timeout 140s;
            proxy_buffering off;
        }
        location /wayline/ {
            proxy_pass http://$portal_api_upstream;
            proxy_http_version 1.1;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header Connection '';
            proxy_read_timeout 230s;
            proxy_send_timeout 230s;
            proxy_buffering off;
        }
        # Stable shared UI URLs must revalidate on each release.
        location ^~ /ecosystem/ {
            try_files $uri =404;
            expires -1;
        }
        location /assets/ {
            try_files $uri =404;
            add_header Cache-Control 'public, max-age=31536000, immutable';
        }
        # The React error view is served with the original HTTP status.
        # API and auth locations above keep their own machine responses.
        location = /proxy-4.14 {
            try_files /index.html =404;
            add_header Cache-Control 'no-store';
            add_header X-Content-Type-Options nosniff always;
            add_header Referrer-Policy same-origin always;
            add_header X-Frame-Options DENY always;
        }
        location = /401 { error_page 401 /index.html; return 401; }
        location = /403 { error_page 403 /index.html; return 403; }
        location = /404 { error_page 404 /index.html; return 404; }
        location / {
            error_page 404 /index.html;
            try_files $uri $uri/ =404;
            add_header Cache-Control 'no-cache';
        }
    }
}
