[build-system]
requires = ["setuptools>=80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "pl-monitoring-admin"
version = "0.1.0"
description = "Safe operations console for the PL monitoring stack"
requires-python = ">=3.13,<3.14"
dependencies = [
  "alembic==1.18.5",
  "argon2-cffi==25.1.0",
  "fastapi==0.139.0",
  "httpx==0.28.1",
  "jinja2==3.1.6",
  "python-multipart==0.0.20",
  "sqlalchemy==2.0.51",
  "uvicorn==0.35.0",
]

[project.optional-dependencies]
test = ["pytest==8.4.2", "pytest-asyncio==1.2.0", "respx==0.22.0"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-ra --strict-markers"
