[build-system]
requires = ["setuptools>=80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "pl-websites-admin"
version = "1.0.0"
description = "Internal UI for managing Prometheus website targets"
requires-python = ">=3.13,<3.14"
dependencies = [
  "alembic==1.18.5",
  "argon2-cffi==25.1.0",
  "beautifulsoup4==4.15.0",
  "fastapi==0.139.0",
  "httpcore==1.0.9",
  "httpx==0.28.1",
  "jinja2==3.1.6",
  "lxml==6.1.1",
  "python-multipart==0.0.20",
  "ruamel.yaml==0.19.1",
  "sqlalchemy==2.0.51",
  "uvicorn==0.35.0",
]

[project.optional-dependencies]
test = [
  "pytest==8.4.2",
  "pytest-asyncio==1.2.0",
  "respx==0.22.0",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-ra --strict-markers"
