worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;
events { worker_connections 1024; }
http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    log_format safe '$remote_addr $request_method $uri $status';
    access_log /dev/stdout safe;
    client_body_temp_path /tmp/client_temp;
    proxy_temp_path /tmp/proxy_temp;
    fastcgi_temp_path /tmp/fastcgi_temp;
    uwsgi_temp_path /tmp/uwsgi_temp;
    scgi_temp_path /tmp/scgi_temp;
    server_tokens off;
    resolver 127.0.0.11 valid=5s ipv6=off;
    map $http_upgrade $grafana_connection {
        default upgrade;
        '' close;
    }
    map "$request_method:$http_accept" $wiki_login_document {
        default 0;
        ~^(GET|HEAD):.*text/html 1;
    }
    server {
        listen 8443 ssl;
        # The published PL port may differ from the container's TLS listener.
        absolute_redirect off;
        ssl_certificate /run/pl/tls.crt;
        ssl_certificate_key /run/pl/tls.key;
        ssl_protocols TLSv1.2 TLSv1.3;
        root /usr/share/nginx/html;
        index index.html;
        client_max_body_size 5m;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy same-origin always;
        add_header X-Frame-Options DENY always;
        set $api api:8080;
        location ~ ^/inventory(/|$) {
            client_max_body_size 64m;
            proxy_request_buffering off;
            proxy_pass http://$api$request_uri;
            proxy_http_version 1.1;
            proxy_set_header Host $http_host;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header Connection '';
            proxy_read_timeout 180s;
        }
        location = /netmap {
            return 308 /netmap/$is_args$args;
        }
        location ^~ /netmap/ {
            proxy_pass http://$api$request_uri;
            proxy_http_version 1.1;
            proxy_set_header Host $http_host;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header Connection '';
            proxy_read_timeout 60s;
        }
        location = /wiki {
            return 308 /wiki/$is_args$args;
        }
        location = /_pl/bookstack-upstream {
            internal;
            # auth_request inherits the upload Content-Length even without a body.
            client_max_body_size 101m;
            proxy_pass http://$api/internal/routing/bookstack?;
            proxy_method GET;
            proxy_pass_request_body off;
            proxy_pass_request_headers off;
            proxy_set_header Content-Length '';
            proxy_set_header Cookie $http_cookie;
            proxy_set_header X-Original-Method $wiki_original_method;
            proxy_set_header X-Original-URI $wiki_original_uri;
            proxy_set_header X-Original-Origin $http_origin;
            proxy_set_header X-Original-Upgrade $http_upgrade;
            proxy_set_header X-Original-Sec-Fetch-Site $http_sec_fetch_site;
        }
        location ^~ /wiki/ {
            # A 100 MiB native file plus its multipart form fields.
            client_max_body_size 101m;
            set $wiki_original_method $request_method;
            set $wiki_original_uri $request_uri;
            auth_request /_pl/bookstack-upstream;
            auth_request_set $wiki_upstream $upstream_http_x_pl_bookstack_upstream;
            auth_request_set $wiki_cookie $upstream_http_x_pl_bookstack_cookie;
            error_page 401 = @wiki_session_required;
            error_page 500 502 504 =503 @wiki_unavailable;
            rewrite ^/wiki/(.*)$ /$1 break;
            proxy_pass $wiki_upstream$uri$is_args$args;
            proxy_http_version 1.1;
            proxy_set_header Host $http_host;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header Cookie $wiki_cookie;
            proxy_set_header X-PL-Gateway-Assertion '';
            proxy_set_header X-PL-Gateway-Signature '';
            proxy_set_header X-PL-User '';
            proxy_set_header X-PL-Admin '';
            proxy_set_header X-Remote-User '';
            proxy_set_header Remote-User '';
            proxy_set_header X-Forwarded-User '';
            proxy_set_header Proxy-Authorization '';
            proxy_set_header Remote-Name '';
            proxy_set_header Remote-Email '';
            proxy_set_header Remote-Groups '';
            proxy_set_header X-Auth-User '';
            proxy_set_header X-Auth-Name '';
            proxy_set_header X-Auth-Email '';
            proxy_set_header X-Auth-Groups '';
            proxy_set_header X-Auth-Role '';
            proxy_set_header X-WEBAUTH-USER '';
            proxy_set_header X-WEBAUTH-NAME '';
            proxy_set_header X-WEBAUTH-EMAIL '';
            proxy_set_header X-WEBAUTH-GROUPS '';
            proxy_set_header X-WEBAUTH-ROLE '';
            proxy_set_header X-PL-User '';
            proxy_set_header X-PL-Name '';
            proxy_set_header X-PL-Admin '';
            proxy_set_header X-Forwarded-Email '';
            proxy_set_header X-Forwarded-Groups '';
            proxy_set_header X-Original-Method '';
            proxy_set_header X-Original-URI '';
            proxy_set_header X-Original-Origin '';
            proxy_set_header X-Original-Upgrade '';
            proxy_set_header X-Original-Sec-Fetch-Site '';
            proxy_set_header X-PL-Bookstack-Upstream '';
            proxy_set_header X-PL-Bookstack-Cookie '';
            proxy_set_header Connection '';
            proxy_redirect off;
            proxy_read_timeout 60s;
        }
        location @wiki_session_required {
            if ($wiki_login_document) {
                return 303 /401?return_to=%2Fwiki%2F;
            }
            default_type application/json;
            return 401 '{"error":"session_expired","message":"Войдите в Платформу"}';
        }
        location @wiki_unavailable {
            default_type application/json;
            return 503 '{"error":"wiki_unavailable","message":"Wiki не установлена, отключена или недоступна"}';
        }
        location = /grafana {
            return 308 /grafana/$is_args$args;
        }
        # This subrequest only looks up an installed container. Grafana owns
        # authentication; neither a Platform session nor a Platform role is used.
        location = /_pl/grafana-upstream {
            internal;
            proxy_pass http://$api/internal/routing/grafana?;
            proxy_method GET;
            proxy_pass_request_body off;
            proxy_pass_request_headers off;
            proxy_set_header Content-Length '';
            proxy_set_header Cookie $http_cookie;
        }
        location ^~ /grafana/ {
            client_max_body_size 0;
            auth_request /_pl/grafana-upstream;
            auth_request_set $grafana_upstream $upstream_http_x_pl_grafana_upstream;
            auth_request_set $grafana_cookie $upstream_http_x_pl_grafana_cookie;
            error_page 500 502 504 =503 @grafana_unavailable;
            proxy_pass $grafana_upstream$request_uri;
            proxy_http_version 1.1;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Host $http_host;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header Cookie $grafana_cookie;
            proxy_set_header Authorization $http_authorization;
            proxy_set_header Origin $http_origin;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $grafana_connection;
            proxy_set_header X-WEBAUTH-USER '';
            proxy_set_header X-WEBAUTH-NAME '';
            proxy_set_header X-WEBAUTH-ROLE '';
            proxy_set_header X-WEBAUTH-EMAIL '';
            proxy_set_header X-WEBAUTH-GROUPS '';
            proxy_set_header X-PL-User '';
            proxy_set_header X-PL-Role '';
            proxy_set_header X-PL-Gateway-Assertion '';
            proxy_set_header X-PL-Gateway-Signature '';
            proxy_set_header X-PL-Grafana-Cookie '';
            proxy_set_header X-PL-Grafana-Mode '';
            proxy_set_header X-PL-Grafana-Org '';
            proxy_set_header X-PL-User '';
            proxy_set_header X-PL-Role '';
            proxy_set_header X-PL-Name '';
            proxy_set_header X-PL-Email '';
            proxy_set_header X-PL-Grafana-Upstream '';
            proxy_set_header X-PL-Grafana-Cookie '';
            proxy_set_header X-PL-Timestamp '';
            proxy_set_header X-PL-Signature '';
            proxy_set_header X-PL-Transport-Meta '';
            proxy_set_header X-Forwarded-User '';
            proxy_set_header X-Forwarded-Email '';
            proxy_set_header Proxy-Authorization '';
            proxy_connect_timeout 5s;
            proxy_read_timeout 1h;
            proxy_send_timeout 1h;
            proxy_buffering off;
            proxy_request_buffering off;
            proxy_redirect off;
        }
        location @grafana_unavailable {
            default_type application/json;
            return 503 '{"error":"grafana_unavailable","message":"Локальная Grafana не установлена, отключена, выбрана неоднозначно или недоступна"}';
        }
        location = /api/v1/stream {
            proxy_pass http://$api;
            proxy_http_version 1.1;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header Connection '';
            proxy_buffering off;
            proxy_read_timeout 1h;
        }
        location = /doska/api/doska/events {
            proxy_pass http://$api;
            proxy_http_version 1.1;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header Connection '';
            proxy_buffering off;
            proxy_read_timeout 1h;
        }
        location ~ "^/doska/api/ws/[A-Za-z0-9_-]{1,128}$" {
            proxy_pass http://$api;
            proxy_http_version 1.1;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection upgrade;
            proxy_connect_timeout 5s;
            proxy_read_timeout 1h;
            proxy_send_timeout 1h;
            proxy_buffering off;
        }
        location ~ "^/doska/api/doska/projects/[A-Za-z0-9_-]{1,128}/tasks/[A-Za-z0-9_-]{1,128}/attachment-uploads/[A-Za-z0-9_-]{1,128}/content$" {
            client_max_body_size 25m;
            client_body_timeout 5m;
            proxy_request_buffering off;
            proxy_buffering off;
            proxy_pass http://$api;
            proxy_http_version 1.1;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header Connection '';
            proxy_connect_timeout 5s;
            proxy_read_timeout 5m;
            proxy_send_timeout 5m;
        }
        location ~ ^/api/v1/modules/[0-9a-f-]+/sftpgo/files/content$ {
            client_max_body_size 1g;
            client_body_timeout 30m;
            proxy_request_buffering off;
            proxy_buffering off;
            proxy_pass http://$api;
            proxy_http_version 1.1;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header Connection '';
            proxy_connect_timeout 5s;
            proxy_read_timeout 30m;
            proxy_send_timeout 30m;
        }
        location ~ ^/(api/|auth/|health/) {
            proxy_pass http://$api;
            proxy_http_version 1.1;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header Connection '';
            proxy_connect_timeout 5s;
            proxy_read_timeout 60s;
        }
        # Wayline's bounded diagnostic requests retain their existing timeout.
        location ~ ^/wayline(/|$) {
            proxy_pass http://$api;
            proxy_http_version 1.1;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header Connection '';
            proxy_connect_timeout 5s;
            proxy_read_timeout 230s;
            proxy_send_timeout 230s;
            proxy_buffering off;
        }
        # These service paths enter the authenticated PL gateway.
        # The slash/end boundary leaves unrelated SPA routes outside this lane.
        location ~ ^/(audit|audit-arch|wayline|forms|doska|directory)(/|$) {
            proxy_pass http://$api;
            proxy_http_version 1.1;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header Connection '';
            proxy_connect_timeout 5s;
            proxy_read_timeout 60s;
        }
        # Stable shared UI URLs must revalidate on each release.
        location ^~ /ecosystem/ {
            try_files $uri =404;
            expires -1;
        }
        location /assets/ {
            try_files $uri =404;
            add_header Cache-Control 'public, max-age=31536000, immutable';
        }
        location / { try_files $uri $uri/ /index.html; }
    }
}
