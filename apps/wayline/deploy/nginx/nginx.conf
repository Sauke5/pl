worker_processes auto;
pid /tmp/nginx.pid;

error_log /dev/stderr notice;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';
    access_log /dev/stdout main;

    sendfile on;
    keepalive_timeout 65;
    server_tokens off;

    client_body_temp_path /tmp/client_temp;
    proxy_temp_path /tmp/proxy_temp;
    fastcgi_temp_path /tmp/fastcgi_temp;
    uwsgi_temp_path /tmp/uwsgi_temp;
    scgi_temp_path /tmp/scgi_temp;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    upstream wayline_api {
        server api:8080;
        keepalive 16;
    }

    server {
        listen 8080;
        server_name _;

        auth_basic "Wayline";
        auth_basic_user_file /run/secrets/wayline.htpasswd;

        root /usr/share/nginx/html;
        index index.html;

        location = /healthz {
            auth_basic off;
            access_log off;
            default_type text/plain;
            return 200 'ok\n';
        }

        location /api/ {
            proxy_pass http://wayline_api;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_connect_timeout 5s;
            # Ручные MTR-проверки синхронны и могут занимать до 210 секунд.
            # Небольшой запас предотвращает 504 до штатного timeout backend.
            proxy_read_timeout 220s;
            proxy_send_timeout 220s;
        }

        location = /metrics {
            proxy_pass http://wayline_api/metrics;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location / {
            try_files $uri $uri/ /index.html;
        }
    }
}
