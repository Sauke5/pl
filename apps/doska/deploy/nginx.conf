worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;
events { worker_connections 512; }
http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  access_log /dev/stdout;
  server_tokens off;
  client_body_temp_path /tmp/client;
  proxy_temp_path /tmp/proxy;
  fastcgi_temp_path /tmp/fastcgi;
  uwsgi_temp_path /tmp/uwsgi;
  scgi_temp_path /tmp/scgi;
  server {
    listen 8080;
    root /usr/share/nginx/html;
    location = /__pl_manifest.json { alias /usr/share/pl/doska/gateway-manifest.json; default_type application/json; add_header Cache-Control no-store; }
    location = /healthz { return 200 'ok'; add_header Content-Type text/plain; }
    location ^~ /doska/api/ { return 404; }
    location ~* \.(?:map|env)$ { return 404; }
    location /doska/assets/ { try_files $uri =404; add_header Cache-Control 'public, max-age=31536000, immutable'; }
    location /doska/ { try_files $uri $uri/ /doska/index.html; add_header Cache-Control 'no-store'; }
    location / { return 404; }
  }
}
